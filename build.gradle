plugins {
    id 'application'
}

group = 'com.studentmarket'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // Driver JDBC MySQL (satu-satunya library tambahan)
    implementation 'com.mysql:mysql-connector-j:8.4.0'
}

application {
    mainClass = 'com.studentmarket.StudentMarketApplication'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
